[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-translator"
version = "0.1.0"
description = "A verifiable multi-agent pipeline for translating layout-heavy annual reports (tables + charts + prose)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TODO: your name" }]
keywords = ["llm", "agent", "multimodal", "document-ai", "translation", "annual-report"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# ---------------------------------------------------------------------------
# Dependency policy
# ---------------------------------------------------------------------------
# The core pipeline (parser structure logic, chunker, number guard, HITL,
# CLI, mock backends, entire test suite) runs on the Python standard library
# ONLY. That is a deliberate engineering constraint: the interviewer can clone
# the repo and run `python -m art demo` + `pytest` with zero installs, which is
# exactly the "verifiable" property we are optimising for.
#
# Everything below is an OPTIONAL extra for production backends.
dependencies = []

[project.optional-dependencies]
# Real VLM / LLM backends. DashScope's Qwen endpoint is OpenAI-compatible, so
# the built-in stdlib client already works; `openai` is only a convenience.
llm = ["openai>=1.40"]
# Local OCR / layout fallback when no VLM API is available.
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
# PDF rasterisation. Without it the parser still accepts pre-rendered images.
pdf = ["pymupdf>=1.24"]
images = ["pillow>=10.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# ``httpx`` is not a runtime dependency of the app -- it is the ASGI transport
# that Starlette's TestClient rides on, so it belongs with the test tooling.
# Without it a clean `pip install -e ".[web]"` fails the web *tests* with an
# ImportError instead of skipping them.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
all = ["openai>=1.40", "pymupdf>=1.24", "pillow>=10.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
art = "art.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``network`` tests are deselected by default -- the whole suite must pass with no
# internet and no credentials. Opt back in with: pytest -m network
addopts = '-q --strict-markers -m "not network"'
# Run straight from a clone: no `pip install -e .` needed, tests import `art`
# from `src/`. Keeps the "clone and run" promise intact.
pythonpath = ["src"]
markers = [
    "network: tests that hit a real external API (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = [
    # Line length is enforced by review, not by a hard wrap: the pipeline has
    # data tables and Chinese literals where breaking a line hurts readability.
    "E501",
    # ``isinstance(x, (A, B))`` is kept over ``A | B``: the tuple form is the
    # more widely recognised idiom and reads better in the layout code, which
    # chains several of these.
    "UP038",
    # ``close()`` is a deliberate no-op on the analyzer and LLM protocols. Can't
    # be @abstractmethod -- the offline backends have nothing to release, and
    # forcing them to implement an empty method is worse than the empty default.
    "B027",
    # FastAPI's own documented idiom for an optional JSON body. The warning is
    # correct in general and wrong here.
    "B008",
]
